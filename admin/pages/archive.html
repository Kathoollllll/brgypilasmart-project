<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Archive — BrgyPilaSmart Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/styles.css"/>
  <link rel="dns-prefetch" href="https://www.gstatic.com"/>
  <link rel="dns-prefetch" href="https://firestore.googleapis.com"/>
</head>
<body class="bg-[#F0F2F5] min-h-screen">

  <div id="page-content" class="min-h-screen">
    <div class="px-8 py-7">

      <!-- ── Page header ──────────────────────────────────────────────────── -->
      <div class="mb-6">
        <h1 class="text-[28px] font-extrabold text-gray-900 mb-2">Digital Archive</h1>
        <p class="text-sm text-gray-500 max-w-sm leading-relaxed">
          Securely manage and retrieve all completed community
          certifications, permits, and historical records from a centralized
          repository.
        </p>
      </div>

      <!-- ── Filter bar ───────────────────────────────────────────────────── -->
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-6">
        <div class="flex flex-wrap items-end gap-4">

          <!-- Search Resident -->
          <div class="flex-1 min-w-[180px]">
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">
              Search Resident
            </p>
            <div class="relative">
              <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
                   fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
              <input id="search-input" type="text" placeholder="Enter name or ID..."
                class="w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm
                       focus:outline-none focus:ring-2 focus:ring-[#1A56DB]/20
                       focus:border-[#1A56DB] transition text-gray-700 placeholder-gray-400"/>
            </div>
          </div>

          <!-- Document Type -->
          <div class="flex-1 min-w-[160px]">
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">
              Document Type
            </p>
            <div class="relative">
              <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
                   fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0
                     01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              <select id="type-filter"
                class="w-full appearance-none pl-9 pr-8 py-2.5 border border-gray-200 rounded-xl text-sm
                       text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-[#1A56DB]/20
                       focus:border-[#1A56DB] transition cursor-pointer">
                <option value="">All Documents</option>
                <option>Barangay Clearance</option>
                <option>Certificate of Residency</option>
                <option>Barangay ID</option>
                <option>Certificate of Indigency</option>
              </select>
              <svg class="w-4 h-4 absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
                   fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </div>

          <!-- Completion Date -->
          <div class="flex-1 min-w-[160px]">
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1.5">
              Completion Date
            </p>
            <div class="relative">
              <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
                   fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2
                     2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
              <input id="date-filter" type="date"
                class="w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm
                       text-gray-500 focus:outline-none focus:ring-2 focus:ring-[#1A56DB]/20
                       focus:border-[#1A56DB] transition"/>
            </div>
          </div>

          <!-- Clear Filters -->
          <button id="clear-btn"
            class="px-5 py-2.5 bg-gray-800 hover:bg-gray-900 text-white text-sm font-semibold
                   rounded-xl transition whitespace-nowrap">
            Clear Filters
          </button>
        </div>
      </div>

      <!-- ── Archive cards grid (2 columns matching design) ──────────────── -->
      <div id="archive-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="col-span-full text-center py-16 text-gray-400">Loading…</div>
      </div>

      <!-- ── Pagination ────────────────────────────────────────────────────── -->
      <div id="pagination" class="flex items-center justify-center gap-1 mt-8 hidden">
        <button id="pg-prev"
          class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200
                 text-gray-500 hover:bg-gray-100 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <div id="pg-numbers" class="flex gap-1"></div>
        <button id="pg-next"
          class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200
                 text-gray-500 hover:bg-gray-100 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <script type="module">
    import { AuthService }    from "../js/auth.service.js";
    import { RequestService } from "../js/request.service.js";
    import { initLayout, wireLogout, fmtDate } from "../js/ui.helpers.js";

    initLayout("archive");

    const PAGE_SIZE = 6; // 3 rows × 2 cols
    let allReady    = [];
    let filtered    = [];
    let currentPage = 1;

    // Doc type → short label + color for chip
    const TYPE_CHIP = {
      "Barangay Clearance":      { label: "BRGY. CLEARANCE",       bg: "#E8F0FE", color: "#1A56DB" },
      "Certificate of Residency":{ label: "RESIDENCE CERT.",        bg: "#E8F0FE", color: "#1A56DB" },
      "Barangay ID":             { label: "BARANGAY ID",            bg: "#F3E8FF", color: "#7C3AED" },
      "Certificate of Indigency":{ label: "INDIGENCY CERTIFICATE",  bg: "#F3E8FF", color: "#7C3AED" },
    };

    // Doc type → icon path
    const TYPE_ICON = {
      "Barangay Clearance":
        `<path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>`,
      "Certificate of Residency":
        `<path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>`,
      "Barangay ID":
        `<path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5zm6-10.125a1.875 1.875 0 11-3.75 0 1.875 1.875 0 013.75 0zm1.294 6.336a6.721 6.721 0 01-3.17.789 6.721 6.721 0 01-3.168-.789 3.376 3.376 0 016.338 0z"/>`,
      "Certificate of Indigency":
        `<path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>`,
    };

    // ── Render grid ───────────────────────────────────────────────────────────
    function renderGrid() {
      const grid  = document.getElementById("archive-grid");
      const pgWrap= document.getElementById("pagination");
      const start = (currentPage - 1) * PAGE_SIZE;
      const page  = filtered.slice(start, start + PAGE_SIZE);

      if (!filtered.length) {
        grid.innerHTML =
          `<div class="col-span-full flex flex-col items-center py-20 text-gray-400">
             <svg class="w-14 h-14 mb-3 text-gray-200" fill="none" stroke="currentColor"
                  stroke-width="1.5" viewBox="0 0 24 24">
               <path stroke-linecap="round" stroke-linejoin="round"
                 d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>
             </svg>
             <p class="font-semibold text-gray-500">No archived records found.</p>
           </div>`;
        pgWrap.classList.add("hidden");
        return;
      }

      grid.innerHTML = page.map((r) => {
        const chip = TYPE_CHIP[r.documentType] ?? { label: r.documentType.toUpperCase(), bg: "#E5E7EB", color: "#6B7280" };
        const icon = TYPE_ICON[r.documentType] ?? TYPE_ICON["Barangay Clearance"];
        // Generate a fake archive ref matching design pattern
        const arcRef = "#ARC-" + (r.createdAt?.toDate?.().getFullYear() ?? "2025") +
                       "-" + r.id.slice(0, 3).toUpperCase();

        return `
          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5
                      hover:shadow-md transition cursor-pointer"
               onclick="window.location.href='./request-detail.html?id=${r.id}'">

            <!-- Top row: chip + ref + eye icon -->
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded"
                      style="background:${chip.bg};color:${chip.color}">
                  ${chip.label}
                </span>
                ${r.status ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full border border-gray-200 text-gray-600">${r.status.toUpperCase()}</span>` : ""}
                <span class="text-[10px] text-gray-400 font-mono">${arcRef}</span>
              </div>
              <!-- Eye icon -->
              <button onclick="event.stopPropagation();window.location.href='./request-detail.html?id=${r.id}'"
                class="p-1.5 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.477
                       0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>

            <!-- Doc icon + name + date -->
            <div class="flex items-start gap-3 mb-3">
              <div class="w-9 h-9 bg-blue-50 rounded-xl flex items-center justify-center shrink-0">
                <svg class="w-5 h-5 text-[#1A56DB]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  ${icon}
                </svg>
              </div>
              <div>
                <p class="font-bold text-gray-900 text-sm">${r.userName}</p>
                <p class="text-[11px] text-gray-400 flex items-center gap-1 mt-0.5">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  </svg>
                  Archived on ${fmtDate(r.createdAt)}
                </p>
              </div>
            </div>

            <!-- Purpose chip + Download Original -->
            <div class="flex items-center justify-between">
              <span class="text-xs bg-gray-100 text-gray-500 px-2.5 py-1 rounded-lg font-medium">
                Purpose: ${r.purpose ?? "General"}
              </span>

              <!-- Download Original → opens ID image or shows message -->
              <button onclick="event.stopPropagation();${
                r.idImageUrl
                  ? `(()=>{const a=document.createElement('a');a.href='data:image/jpeg;base64,${r.idImageUrl}';a.download='${r.userName}_ID.jpg';a.click();})()`
                  : `alert('No ID image available for this request.')`
              }"
                class="flex items-center gap-1.5 text-[#1A56DB] text-xs font-bold hover:underline transition">
                Download<br/>Original
                <div class="w-6 h-6 bg-[#1A56DB] rounded-full flex items-center justify-center shrink-0">
                  <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                  </svg>
                </div>
              </button>
            </div>
          </div>
        `;
      }).join("");

      // Pagination
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
      pgWrap.classList.toggle("hidden", totalPages <= 1);
      renderPagination(totalPages);
    }

    // ── Pagination ────────────────────────────────────────────────────────────
    function renderPagination(totalPages) {
      const nums = document.getElementById("pg-numbers");
      const prev = document.getElementById("pg-prev");
      const next = document.getElementById("pg-next");

      prev.disabled = currentPage <= 1;
      next.disabled = currentPage >= totalPages;
      prev.onclick  = () => { if (currentPage > 1) { currentPage--; renderGrid(); } };
      next.onclick  = () => { if (currentPage < totalPages) { currentPage++; renderGrid(); } };

      // Show: 1 2 3 … totalPages
      const pages = new Set([1, 2, 3, totalPages].filter((p) => p > 0 && p <= totalPages));
      let html = "";
      let prev_ = 0;
      for (const p of [...pages].sort((a,b)=>a-b)) {
        if (p - prev_ > 1) html += `<span class="px-1 text-gray-400 text-sm self-center">…</span>`;
        html += `<button data-p="${p}"
          class="pg-num w-8 h-8 rounded-lg text-sm font-semibold transition
            ${p === currentPage
              ? "bg-[#1A56DB] text-white"
              : "border border-gray-200 text-gray-500 hover:bg-gray-50"}">
          ${p}
        </button>`;
        prev_ = p;
      }
      nums.innerHTML = html;
      nums.querySelectorAll(".pg-num").forEach((btn) =>
        btn.addEventListener("click", () => { currentPage = +btn.dataset.p; renderGrid(); })
      );
    }

    // ── Filter ────────────────────────────────────────────────────────────────
    function applyFilter() {
      const search = document.getElementById("search-input").value.toLowerCase();
      const type   = document.getElementById("type-filter").value;
      const date   = document.getElementById("date-filter").value; // "YYYY-MM-DD"

      filtered = allReady.filter((r) => {
        const matchName = !search || r.userName?.toLowerCase().includes(search);
        const matchType = !type   || r.documentType === type;
        const matchDate = !date   || (() => {
          const d = r.createdAt?.toDate?.();
          return d && d.toISOString().slice(0,10) === date;
        })();
        return matchName && matchType && matchDate;
      });
      currentPage = 1;
      renderGrid();
    }

    ["search-input","type-filter","date-filter"].forEach((id) =>
      document.getElementById(id).addEventListener("input", applyFilter)
    );

    document.getElementById("clear-btn").addEventListener("click", () => {
      document.getElementById("search-input").value = "";
      document.getElementById("type-filter").value  = "";
      document.getElementById("date-filter").value  = "";
      applyFilter();
    });

    // ── Boot ──────────────────────────────────────────────────────────────────
    AuthService.requireAuth((user) => {
      wireLogout(AuthService);
      RequestService.listenReady((reqs) => {
        allReady = reqs;
        applyFilter();
      });
    });
  </script>
</body>
</html>
